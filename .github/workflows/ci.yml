name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEARCH_DATA_DATABASE_URL: postgresql+psycopg://research_data:research_data@localhost:5432/research_data_test
      RESEARCH_DATA_TEST_DATABASE_URL: postgresql+psycopg://research_data:research_data@localhost:5432/research_data_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: research_data_test
          POSTGRES_PASSWORD: research_data
          POSTGRES_USER: research_data
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_data -d research_data_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy src tests

      - name: Apply and verify database migration
        run: |
          alembic upgrade head
          alembic check

      - name: Test
        run: pytest --cov=research_data_builder --cov-report=term-missing --cov-report=xml

      - name: Verify migration round trip
        run: |
          alembic downgrade base
          alembic upgrade head

  container:
    name: Validate container configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag research-data-builder:ci .

  infrastructure:
    name: Validate Terraform infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate state bootstrap
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate platform foundation
        working-directory: infra/terraform/platform
        run: |
          terraform init -backend=false -input=false
          terraform validate
