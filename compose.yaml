name: research-data-builder

services:
  api:
    build:
      context: .
    environment:
      RESEARCH_DATA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-research_data}:${POSTGRES_PASSWORD:-research_data}@postgres:5432/${POSTGRES_DB:-research_data}
      RESEARCH_DATA_ENVIRONMENT: development
      RESEARCH_DATA_LOG_LEVEL: INFO
      RESEARCH_DATA_ARTIFACT_ROOT: /app/artifacts
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
    command: ["python", "-m", "research_data_builder.jobs.worker"]
    environment:
      RESEARCH_DATA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-research_data}:${POSTGRES_PASSWORD:-research_data}@postgres:5432/${POSTGRES_DB:-research_data}
      RESEARCH_DATA_ENVIRONMENT: development
      RESEARCH_DATA_LOG_LEVEL: INFO
      RESEARCH_DATA_ARTIFACT_ROOT: /app/artifacts
      RESEARCH_DATA_WORKER_POLL_SECONDS: 1
      RESEARCH_DATA_WORKER_LEASE_SECONDS: 60
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_data}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research_data}
      POSTGRES_USER: ${POSTGRES_USER:-research_data}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-research_data} -d ${POSTGRES_DB:-research_data}
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:

